name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  # A new push to a PR cancels the previous run. Pushes to main are never cancelled —
  # every commit on the default branch keeps its own verdict.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"
  # No NODE_VERSION: the Node lane reads .nvmrc (docs/ci.md).

# Every job sets timeout-minutes; the default is six hours. Every checkout sets
# persist-credentials: false except the tag-pushing job in release.yml. Actions are SHA-pinned
# on a node24 major — GitHub removes Node 20 from runners on 2026-09-16 (docs/ci.md).

jobs:
  # ---------------------------------------------------------------------------
  # Secrets first. A leaked credential is the one finding whose cost keeps rising
  # while the rest of the pipeline runs, so nothing waits on anything else here.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2+ needs a (free) licence key for organisation-owned repos.
          # Store it as GITLEAKS_LICENSE in BOTH Actions secrets and Dependabot secrets —
          # Dependabot PRs cannot read Actions secrets, and without it they stay red.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------------
  # Repository integrity. Cheap, stdlib-only, and NEVER conditional: doc and ticket
  # drift must be caught on a docs-only pull request too, which is exactly the kind
  # that tempts people to skip the heavy lanes.
  # ---------------------------------------------------------------------------
  repo-checks:
    name: Repository checks (docs, tickets, adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # Cheapest check, and the one whose failure explains the most (CI-01).
      - name: Executable bits are recorded in the git index
        run: python scripts/lint_executable_bits.py

      # Same class of defect, the other axis: a blob written past git's clean filter.
      - name: Line endings are recorded LF in the git index
        run: python scripts/lint_line_endings.py

      - name: Documentation frontmatter (summary + read_when on every knowledge doc)
        run: python scripts/docs_list.py

      - name: Documentation map is fresh (no heading drift)
        run: python scripts/generate_docs_map.py --check

      - name: Ticket-tree consistency (INDEX <-> tickets/, no cycles, views fresh)
        run: python scripts/check_tickets.py --check

      - name: Agent-adapter consistency (two-layer architecture, ADR-0002)
        run: python scripts/lint_adapters.py

      - name: Documentation discoverability (hub reachability, no dead links)
        run: python scripts/lint_docs_index.py

      - name: Repository language (English only)
        run: python scripts/lint_language.py

      # Releasing must stay a deliberate act. A comment saying so is not a control:
      # two accidental YAML lines in release.yml would otherwise leave every gate green.
      - name: Releasing stays manual (no event may trigger a release)
        run: python scripts/lint_workflow_triggers.py

      # Invariant #1 of skills/critical-invariants.md, as an executable sweep rather
      # than a hope: no code path may branch on actor kind to decide a permission.
      #
      # The self-test runs first and is not ceremony: a linter nobody has watched fire is
      # an assertion. It sweeps fixtures that must be found and fixtures that must not, so
      # a regex broken by a later edit fails here rather than going quietly permissive.
      - name: Critical-invariant firewall fires (paired negative)
        run: python scripts/lint_invariants.py --self-test

      - name: Critical-invariant firewall (actor kind never gates permission)
        run: python scripts/lint_invariants.py

      # No TODO/FIXME. A finding is fixed, dropped with a recorded reason, or ticketed —
      # a comment is none of those, it is a finding hidden where no index reaches it.
      - name: No TODO/FIXME comments
        run: |
          if grep -rInE '(^|[^A-Za-z])(TODO|FIXME)([^A-Za-z]|$)' \
               --include='*.kt' --include='*.kts' --include='*.ts' --include='*.tsx' \
               --include='*.sql' --include='*.py' \
               backend/ frontend/ db/ scripts/ 2>/dev/null; then
            echo "::error::TODO/FIXME found. Fix it, drop it with a recorded reason, or open a ticket (docs/PROJECT_MANAGEMENT.md § 8)."
            exit 1
          fi
          echo "OK - no TODO/FIXME comments."

  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          # The wrapper JAR is validated against the published checksums. A tampered
          # wrapper executes arbitrary code with the job's token; this is the one
          # supply-chain check a Gradle build cannot skip.
          validate-wrappers: true
          # Not the commercial default; see docs/ci.md § Why the Gradle cache is the basic one.
          cache-provider: basic

      - name: Lint (ktlint)
        working-directory: backend
        run: ./gradlew ktlintCheck --no-daemon

      - name: Static analysis (detekt)
        working-directory: backend
        run: ./gradlew detekt --no-daemon

      # Registered on the ROOT project, not on :domain. Addressing it as
      # `:domain:checkModuleBoundaries` fails with 'task not found', which is how this guard
      # managed to be dead while looking present.
      - name: Module boundaries hold (:domain stays framework-free)
        working-directory: backend
        run: ./gradlew checkModuleBoundaries --no-daemon

      # Testcontainers needs a Docker daemon; ubuntu-latest has one. RLS policies and
      # append-only triggers cannot be tested against a substitute, so they are tested
      # against a real Postgres or not at all.
      - name: Test
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Build
        working-directory: backend
        run: ./gradlew build -x test --no-daemon

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # From .nvmrc, not a major — see docs/ci.md.
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install (locked)
        run: yarn install --frozen-lockfile

      - name: Generated API client is current
        # The client is generated from the committed OpenAPI document. Regenerating and
        # finding a diff means the contract moved and the client did not — which is the
        # drift the generation step exists to prevent, so it fails here rather than in a
        # runtime type error nobody traces back.
        run: |
          yarn api:generate
          if ! git diff --quiet -- src/api/generated; then
            echo "::error::src/api/generated is stale — run 'yarn api:generate' and commit the result."
            git diff --stat -- src/api/generated
            exit 1
          fi

      - name: Lint (max-warnings 0)
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Test + per-file coverage gate (>= 80% each)
        run: yarn test:coverage

      - name: Production build
        run: yarn build

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  database:
    name: Database (migrations + schema rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nodera_ci
          POSTGRES_USER: nodera_owner
          POSTGRES_PASSWORD: ci-dummy
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: SQL conventions (lowercase identifiers, every FK indexed)
        run: python scripts/lint_sql.py

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          validate-wrappers: true
          # Not the commercial default; see docs/ci.md § Why the Gradle cache is the basic one.
          cache-provider: basic

      - name: Apply migrations to an empty database
        working-directory: backend
        env:
          NODERA_DB_URL: jdbc:postgresql://localhost:5432/nodera_ci
          NODERA_DB_USER: nodera_owner
          NODERA_DB_PASSWORD: ci-dummy
          NODERA_APP_PASSWORD: ci-dummy
        run: ./gradlew :app:run --args=migrate --no-daemon

      # A migration that applies once but not twice is a migration that will fail on the
      # next deployment. Running it against an already-migrated database proves the
      # sequence is idempotent at the Flyway level rather than assuming it.
      - name: Re-run migrations (no-op on an already-migrated database)
        working-directory: backend
        env:
          NODERA_DB_URL: jdbc:postgresql://localhost:5432/nodera_ci
          NODERA_DB_USER: nodera_owner
          NODERA_DB_PASSWORD: ci-dummy
          NODERA_APP_PASSWORD: ci-dummy
        run: ./gradlew :app:run --args=migrate --no-daemon

      - name: Schema integrity (actor subtypes exhaustive and exclusive)
        env:
          PGPASSWORD: ci-dummy
        run: psql -h localhost -U nodera_owner -d nodera_ci -v ON_ERROR_STOP=1 -f db/checks/schema_integrity.sql

  # ---------------------------------------------------------------------------
  # The single required check. The branch ruleset names "CI Gate" and nothing else,
  # so adding a lane is a change to `needs:` plus scripts/ci_gate.py — GitHub never
  # learns the job list and no ruleset edit is needed.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [secret-scan, repo-checks, backend, frontend, database]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py
