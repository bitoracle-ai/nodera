name: Release

# Releasing is a deliberate act. This workflow has NO push, pull_request or schedule
# trigger, and nothing else in the repository may target the release environment — that
# is checked by scripts/lint_workflow_triggers.py in the repo-checks job, because a
# comment saying "manual only" is not a control and two accidental YAML lines would
# otherwise leave every gate green.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (SemVer, without a leading v)"
        required: true
        type: string

permissions:
  contents: read

# Conventions as in ci.yml. sigstore/cosign-installer stays on v3: composite, so the Node 20
# removal does not reach it, and v4 swaps the cosign CLI under the untested signing steps.

jobs:
  verify:
    name: Verify the tree is releasable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # The input goes through env: — ${{ }} is substituted before bash parses, so the SemVer
      # guard cannot protect the line it is written on. The build job runs on a validated value.
      - name: Version input is SemVer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a SemVer version (expected 1.2.3 or 1.2.3-rc.1)."
            exit 1
          fi

      # exit 0 = tag exists, 2 = free, anything else = the remote never answered.
      - name: Tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            0) echo "::error::Tag v${VERSION} already exists. A released version is never re-cut."; exit 1 ;;
            2) echo "OK - v${VERSION} is unused." ;;
            *) echo "::error::git ls-remote failed (exit $status) — could not establish whether v${VERSION} exists."; exit 1 ;;
          esac

      - name: CHANGELOG has an entry for this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section. A release without release notes is a release nobody can evaluate."
            exit 1
          fi

      # Keep level with ci.yml's repo-checks: a release can be dispatched on a ref CI never saw.
      - name: Repository gates
        run: |
          python scripts/lint_executable_bits.py
          python scripts/docs_list.py
          python scripts/generate_docs_map.py --check
          python scripts/check_tickets.py --check
          python scripts/lint_adapters.py
          python scripts/lint_docs_index.py
          python scripts/lint_language.py
          python scripts/lint_workflow_triggers.py
          python scripts/lint_invariants.py
          python scripts/lint_sql.py

      - name: No TODO/FIXME comments
        run: |
          if grep -rInE '(^|[^A-Za-z])(TODO|FIXME)([^A-Za-z]|$)' \
               --include='*.kt' --include='*.kts' --include='*.ts' --include='*.tsx' \
               --include='*.sql' --include='*.py' \
               backend/ frontend/ db/ scripts/ 2>/dev/null; then
            echo "::error::TODO/FIXME found. Fix it, drop it with a recorded reason, or open a ticket (docs/PROJECT_MANAGEMENT.md § 8)."
            exit 1
          fi
          echo "OK - no TODO/FIXME comments."

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    # arm64 builds under QEMU emulation.
    timeout-minutes: 60
    needs: verify
    permissions:
      contents: write   # create the tag and the release
      packages: write   # push the container image
      id-token: write   # keyless cosign signing via the OIDC token
    steps:
      # Keeps its credentials: the last step runs `git push origin` for the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          validate-wrappers: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Build backend
        working-directory: backend
        run: ./gradlew build --no-daemon -Pversion=${{ inputs.version }}

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # arm64 is not a niche among self-hosters: Ampere instances, Apple Silicon and Raspberry Pi
      # all land there, and an amd64-only image quietly excludes every one of them.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
          provenance: true
          sbom: true

      # Provenance and an SBOM say what is in the image; a signature is what lets someone who did
      # not build it check that claim. Keyless, so there is no signing key to store or rotate.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      # Signing without verifying is ceremony. This proves the signature is checkable with the
      # exact command the release notes hand to an operator, at the moment it is made — rather
      # than leaving the first real check to whoever first doubts the image.
      - name: Verify the signature the way an operator would
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "ghcr.io/${{ github.repository }}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Record the digest in the job summary
        run: echo "Image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "v${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file <(awk '/^## \[${{ inputs.version }}\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md) \
            compose.prod.yml
