name: Release

# Releasing is a deliberate act. This workflow has NO push, pull_request or schedule
# trigger, and nothing else in the repository may target the release environment — that
# is checked by scripts/lint_workflow_triggers.py in the repo-checks job, because a
# comment saying "manual only" is not a control and two accidental YAML lines would
# otherwise leave every gate green.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (SemVer, without a leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tree is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Version input is SemVer
        run: |
          if ! printf '%s' "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not a SemVer version (expected 1.2.3 or 1.2.3-rc.1)."
            exit 1
          fi

      - name: Tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists. A released version is never re-cut."
            exit 1
          fi

      - name: CHANGELOG has an entry for this version
        run: |
          if ! grep -qF "## [${{ inputs.version }}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ inputs.version }}]' section. A release without release notes is a release nobody can evaluate."
            exit 1
          fi

      - name: Repository gates
        run: |
          python scripts/docs_list.py
          python scripts/check_tickets.py --check
          python scripts/lint_adapters.py
          python scripts/lint_docs_index.py
          python scripts/lint_language.py
          python scripts/lint_sql.py

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write   # create the tag and the release
      packages: write   # push the container image
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96  # v4.4.1
        with:
          validate-wrappers: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Build backend
        working-directory: backend
        run: ./gradlew build --no-daemon -Pversion=${{ inputs.version }}

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Log in to the container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
          provenance: true
          sbom: true

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "v${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file <(awk '/^## \[${{ inputs.version }}\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
