name: Release

# Releasing is a deliberate act. This workflow has NO push, pull_request or schedule
# trigger, and nothing else in the repository may target the release environment — that
# is checked by scripts/lint_workflow_triggers.py in the repo-checks job, because a
# comment saying "manual only" is not a control and two accidental YAML lines would
# otherwise leave every gate green.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (SemVer, without a leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tree is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Version input is SemVer
        run: |
          if ! printf '%s' "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not a SemVer version (expected 1.2.3 or 1.2.3-rc.1)."
            exit 1
          fi

      - name: Tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists. A released version is never re-cut."
            exit 1
          fi

      - name: CHANGELOG has an entry for this version
        run: |
          if ! grep -qF "## [${{ inputs.version }}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ inputs.version }}]' section. A release without release notes is a release nobody can evaluate."
            exit 1
          fi

      - name: Repository gates
        run: |
          python scripts/docs_list.py
          python scripts/check_tickets.py --check
          python scripts/lint_adapters.py
          python scripts/lint_docs_index.py
          python scripts/lint_language.py
          python scripts/lint_sql.py

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write   # create the tag and the release
      packages: write   # push the container image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          validate-wrappers: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Build backend
        working-directory: backend
        run: ./gradlew build --no-daemon -Pversion=${{ inputs.version }}

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
          provenance: true
          sbom: true

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "v${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file <(awk '/^## \[${{ inputs.version }}\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
