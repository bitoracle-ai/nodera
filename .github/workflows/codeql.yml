name: CodeQL

# Static security analysis. Separate from CI on purpose: it is slower than the gates,
# and it must keep running on a schedule even in a quiet week — a vulnerability disclosed
# in a dependency does not wait for someone to push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC. An off-the-hour minute avoids the
                           # scheduling pile-up at :00 that delays queued runs.

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      # codeql-action runs only local git commands and authenticates via its own token input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Kotlin needs a real build for CodeQL to see the code. `-x test` keeps this to
      # compilation: the tests already ran in CI, and running them twice buys nothing.
      - if: matrix.build-mode == 'manual'
        name: Build for analysis
        working-directory: backend
        run: ./gradlew classes -x test --no-daemon

      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: /language:${{ matrix.language }}
