openapi: 3.1.0

# The REST contract, written before the routes rather than derived from them (invariant #11).
# The frontend's types and Zod schemas are generated from this document; CI regenerates and fails
# on a diff, so the client cannot drift from the contract silently.
#
# This document carries every route the server serves and no others: it is streamed at
# GET /openapi.yaml, and ContractDriftTest asserts the routing tree and these paths are the same
# set. docs/API_CONTRACT.md is the wider specification — a route described there and absent here
# is one that does not answer yet, and generating a client for it would produce calls that 404.
#
# Schemas stay inside the subset frontend/scripts/generate-zod.mjs covers: object, string (with
# enum), integer, number, boolean, array and local $ref. Anything else fails that generator loudly
# rather than emitting an unvalidated shape — so a field that may be absent is optional, never
# nullable.

info:
  title: Nodera
  version: 0.1.0
  summary: Project and issue tracking in which people and AI agents are the same kind of participant.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: The instance itself. The web assets are served from this same origin, which is why
      no CORS configuration is part of a normal deployment.

tags:
  - name: health
    description: >-
      Operational probes. Deliberately outside /api/v1: an orchestrator's probe configuration must
      not have to change when the API's major version does, and these endpoints carry no domain
      data, so they have nothing to version.
  - name: contract
    description: The contract serving itself, so a client can read what this instance actually offers.
  - name: authentication
    description: >-
      Turning a credential into a session. An agent needs none of it — it presents its personal
      access token on the request it wanted to make, and there is no sign-in step in its path.
  - name: identity
    description: The caller's own actor and its own credentials. Nothing here resolves a project.

security:
  - bearerAuth: []

paths:
  /openapi.yaml:
    get:
      operationId: openApiDocument
      tags: [contract]
      summary: This document.
      description: >-
        The same bytes the repository holds, streamed from the classpath. A client that reads the
        contract from the instance it is talking to cannot be looking at another version of it.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [authentication]
      summary: Exchange a refresh token for a new session.
      description: >-
        The presented token is revoked in the same transaction that mints its replacement, so a
        captured one replayed afterwards meets a revoked row. A refresh token is not a bearer
        credential and is refused in the Authorization header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new session. The token presented is no longer usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: >-
            Unknown, revoked or expired. Which of the three is named — the caller already holds the
            credential — but an unknown selector and a wrong verifier share one answer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The body is not a refresh request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/me:
    get:
      operationId: whoAmI
      tags: [identity]
      summary: The actor the presented credential belongs to.
      description: >-
        No capability is required and none is checked: a capability is held in a project, and this
        route resolves none. kind is always present, so no client has to infer whether an actor is
        a person.
      responses:
        '200':
          description: The caller's actor envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '401':
          description: No credential, or one that cannot be used.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            The credential resolved and the actor behind it no longer exists. It fails closed rather
            than answering with a partial envelope.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/me/credentials:
    post:
      operationId: issuePersonalAccessToken
      tags: [identity]
      summary: Mint a personal access token for the caller.
      description: >-
        For the caller and for nobody else — there is no field naming an actor. The plaintext is in
        this response and in no other, ever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCredentialRequest'
      responses:
        '201':
          description: The credential, with its plaintext exposed once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCredential'
        '401':
          description: No credential, or one that cannot be used.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The label is empty or too long, or the expiry is absent or not a timestamp.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/me/credentials/{id}:
    delete:
      operationId: revokeCredential
      tags: [identity]
      summary: Revoke one of the caller's own credentials.
      parameters:
        - name: id
          in: path
          required: true
          description: The credential's identifier, as returned when it was issued.
          schema:
            type: string
      responses:
        '204':
          description: Revoked. Repeating the call answers 404, because the row is no longer live.
        '401':
          description: No credential, or one that cannot be used.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            Absent, or somebody else's — one answer on purpose. A distinct 403 would say which
            credential identifiers exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /health/live:
    get:
      operationId: healthLive
      tags: [health]
      summary: Whether the process is running.
      description: >-
        Never consults the database. This is the signal an orchestrator uses to destroy and replace
        a container, so reporting a dependency's state here turns a wait — a pending migration, a
        database that blinked — into a crash loop.
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'

  /health/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Whether this instance may receive traffic.
      description: >-
        Reports not-ready while the database is unreachable or migrations from this build have not
        been applied. Fail closed: a probe that cannot read the migration history does not know the
        schema is current, and "unknown" is never reported as ready.
      security: []
      responses:
        '200':
          description: The schema is current and the instance can serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Migrations are outstanding, or the database could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        An access JWT or a personal access token. One header, two credential shapes, one code path
        behind them — the actor's kind changes nothing about how it is presented or checked.

  schemas:
    Problem:
      type: object
      description: >-
        RFC 9457, plus the stable code clients switch on. The codes are part of the contract and are
        the same ones the MCP surface answers with; renaming one is a breaking change.
      required: [type, title, status, code, detail, instance]
      properties:
        type:
          type: string
          examples: ['https://nodera.dev/errors/not-found']
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - unauthenticated
            - forbidden
            - not_found
            - validation_failed
            - closure_gate_failed
            - dependency_cycle
            - idempotency_conflict
            - rate_limited
        detail:
          type: string
          description: >-
            Human-readable, and never a quotation of what was presented. No problem body carries a
            token, a selector, a verifier, a hash or a sign-in code.
        instance:
          type: string

    ActorRef:
      type: object
      description: >-
        One actor as any response refers to it. kind is always present: no client should ever have
        to infer whether an actor is a person, and one that reads a name pattern instead is a
        blocking review finding.
      required: [id, kind, handle, displayName]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [human, agent]
        handle:
          type: string
        displayName:
          type: string

    Actor:
      type: object
      description: >-
        The actor envelope. owner appears only on agents and is not recursive beyond one level; the
        full chain is at /actors/{id}, which is not served yet.
      required: [id, kind, handle, displayName]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [human, agent]
        handle:
          type: string
        displayName:
          type: string
        owner:
          $ref: '#/components/schemas/ActorRef'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: The opaque token a session was issued with. Spent here and nowhere else.

    Session:
      type: object
      description: >-
        The refresh token is in the body rather than in a Set-Cookie header: scripts, CI jobs and
        agents are first-class clients here and a cookie is invisible to all of them.
      required: [accessToken, expiresAt, refreshToken]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          description: RFC 3339, UTC. When the access token stops being accepted.
          examples: ['2026-09-10T14:22:00Z']
        refreshToken:
          type: string

    IssueCredentialRequest:
      type: object
      required: [label, expiresAt]
      properties:
        label:
          type: string
          description: What the owner calls it. The only part of a credential they can ever read back.
        expiresAt:
          type: string
          description: >-
            RFC 3339, UTC, and required although the column is nullable. A token that never expires
            is a token nobody rotates, and a default chosen here would be a policy invented where
            the deployment cannot be seen.
          examples: ['2027-01-01T00:00:00Z']

    IssuedCredential:
      type: object
      description: The one and only exposure of a token's plaintext.
      required: [id, label, token, expiresAt]
      properties:
        id:
          type: string
        label:
          type: string
        token:
          type: string
          description: >-
            Store it now. It is not retrievable from any endpoint afterwards: the row keeps an
            Argon2id hash of the secret half and the public selector, and neither reconstructs it.
          examples: ['nod_pat_6f1c9a4b2e8d70a3c5f2b1e4_9c2e…']
        expiresAt:
          type: string

    LivenessResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [alive]
        version:
          type: string
          description: >-
            The version this image was stamped with, or "unknown" for a build that was not given
            one. Visible rather than silently plausible — an instance that cannot say what it is
            says so.
          examples: ['1.4.2', 'unknown']

    ReadinessResponse:
      type: object
      required: [status, version, detail]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        version:
          type: string
        detail:
          type: string
          description: >-
            A short, fixed category — never a driver message. This endpoint is unauthenticated, and
            a JDBC exception string routinely carries the host, the port and the connecting user.
          examples: ['schema is current', '2 migration(s) pending', 'database unreachable']
